[project]
name = "myhealth"
version = "0.1.0"
description = "Local Apple Health export analytics and strength workout planning CLI."
requires-python = ">=3.11"
dependencies = [
  "pydantic>=1.10",
  "rich>=13",
  "typer>=0.9",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
myhealth = "myhealth.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

